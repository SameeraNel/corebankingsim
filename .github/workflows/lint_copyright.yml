# This workflow executes several linters on changed files based on languages used in your code base whenever
# you push a code or open a pull request.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/github/super-linter
name: Lint Code Base

on:
  push:
    branches: [ "feature/workflow_test" ]
  pull_request:
    branches: [ "feature/workflow_test" ]
jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v4
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "master"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  run-copyright-check:
    runs-on: ubuntu-latest
    steps:
     - name: Copyright Comment Check
       uses: liquiddevelopmentnet/copyright-check-action@stable-1.0
       with:
        # In which path you wanna check
        path: src/**/*.js
        # For what should the action check
        string: // Copyright (C) 2021 Example, Inc. All Rights reserved.
