name: Lint & Copyright Check on Codebase

on:
  push:
    branches: [ "feature/workflow_test" ]
  pull_request:
    branches: [ "feature/workflow_test" ]
jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v4
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "feature/workflow_test"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  run-copyright-check:
    runs-on: ubuntu-latest
    steps:
     - name: Copyright Comment Check
       uses: liquiddevelopmentnet/copyright-check-action@stable-1.0
       with:
        # In which path you wanna check
        path: src/**/*.java
        # For what should the action check
        string: // Copyright (C) 2021 Example, Inc. All Rights reserved.

 run-fortify-check:
    runs-on: ubuntu-latest
    steps:
      - name: Fortify AST Scan
      uses: fortify/github-action@v1.0.0
      with:
        # Run a SAST scan, takes either true or false (default)
        sast-scan: true
          
